<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Hexagon base (port) -->
  <path
    d="M256 40 L452 148 L452 364 L256 472 L60 364 L60 148 Z"
    fill="url(#bg)"
    stroke="rgba(255,255,255,0.15)"
    stroke-width="8"
  />

  <!-- Folder tab notch (folio) — top-right corner -->
  <path
    d="M320 40 L452 148 L452 172 L320 100 Z"
    fill="rgba(255,255,255,0.12)"
  />

  <!-- Inner circle (port connection dot) -->
  <circle cx="256" cy="256" r="72" fill="rgba(255,255,255,0.18)"/>
  <circle cx="256" cy="256" r="40" fill="rgba(255,255,255,0.9)"/>

  <!-- Small accent dots around the circle -->
  <circle cx="256" cy="146" r="10" fill="rgba(255,255,255,0.5)"/>
  <circle cx="340" cy="220" r="8" fill="rgba(255,255,255,0.4)"/>
  <circle cx="338" cy="298" r="6" fill="rgba(255,255,255,0.35)"/>
  <circle cx="172" cy="220" r="7" fill="rgba(255,255,255,0.35)"/>
  <circle cx="178" cy="292" r="5" fill="rgba(255,255,255,0.3)"/>
</svg>
